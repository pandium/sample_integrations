version: 0.4
base: node:20.9.0
build: npm install --production && npm i --save-dev @types/node && npm run build
run: node .
configs:
  schema:
    properties:
      list_id:
        type: string
      sync_gorgias_customers_to_iterable_users:
        type: boolean
        default: true
    type: object
  uischema:
    elements:
    - label: List Id
      scope: '#/properties/list_id'
      type: Control
    - label: Sync Gorgias Customers To Iterable Users
      scope: '#/properties/sync_gorgias_customers_to_iterable_users'
      type: Control
    type: VerticalLayout
