version: 1.0
base: rust:1.97
build: cargo build --release
run: ./target/release/sb2gorgias
configs:
  schema:
    properties:
      free_text_config_1:
        type: string
      free_text_config_2:
        type: string
      boolean_1:
        type: boolean
        default: true
      boolean_2:
        type: boolean
      colors:
        $ref: '#/metadata/dynamic_colors'

    type: object
  uischema:
    elements:
      - label: Free Text Field 1
        scope: '#/properties/free_text_config_1'
        type: Control
      - label: Free Text Field 2
        scope: '#/properties/free_text_config_2'
        type: Control
      - label: Boolean 1
        scope: '#/properties/boolean_1'
        type: Control
        admin: true
      - label: Boolean 2
        scope: '#/properties/boolean_2'
        type: Control
      - label: Dynamic colors
        scope: '#/properties/colors'
        type: Control
    type: VerticalLayout
metadata_schema:
  schema:
    name: metadata_schema
    properties:
      dynamic_colors:
        type: array
        items:
          type: string
      random_number:
        type: number
